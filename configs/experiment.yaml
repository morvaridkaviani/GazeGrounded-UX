# Own WebGazer study (study/webgazer). Use after collecting real data with consent.
extends: base.yaml

data:
  source: study
  adapter: webgazer_study
  raw_dir: data/raw/study
  data_kind: real

gaze:
  # Webcam gaze is noisier than research-grade eye trackers: use a larger dispersion window.
  dispersion_threshold_px: 120
  minimum_duration_ms: 100
  heatmap_sigma_px: 60
  aoi_margin_px: 40             # webcam gaze is much less accurate
  min_valid_sample_ratio: 0.6

vlm:
  provider: local
  model: Qwen/Qwen2.5-VL-3B-Instruct
  cache: true

friction_model:
  label_source: human
