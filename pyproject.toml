[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazegrounded-ux"
version = "0.1.0"
description = "Task-aware multimodal detection of UX friction using human gaze, vision-language models, deep learning, interaction data and NLP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Morvarid Kaviani" }]
urls = { Homepage = "https://www.morvaridkaviani.com" }
keywords = ["hci", "eye-tracking", "ux", "vision-language-models", "saliency", "multimodal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
    "opencv-python-headless>=4.9",
    "Pillow>=10.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.optional-dependencies]
# Local Hugging Face vision-language models (e.g. Qwen2.5-VL).
vlm = ["transformers>=5.0", "accelerate>=0.34"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.scripts]
gazegrounded = "gazegrounded.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by black

[tool.ruff.lint.isort]
known-first-party = ["gazegrounded"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train small models or run the end-to-end pipeline"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
