# Dashboard theme. Colour roles match the static figures:
# blue = VLM / primary actions, orange = human gaze, neutral warm greys for chrome.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f3f0"
textColor = "#1f2328"
borderColor = "#e1e0d9"
linkColor = "#256abf"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
headingFontWeights = [700, 650, 600]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f3f3f0"
borderColor = "#e1e0d9"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
